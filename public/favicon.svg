  </defs>
  <rect width="512" height="512" rx="115" fill="url(#bg)" />
  <rect x="18" y="18" width="476" height="476" rx="98" fill="none" stroke="url(#gold)" stroke-width="10" stroke-opacity="0.7" />
  <!-- Tilted Holo Card Silhouette -->
