  <text x="256" y="434" font-family="Outfit, Inter, system-ui, sans-serif" font-size="52" font-weight="900" text-anchor="middle" fill="#ffffff" letter-spacing="2">
    mil<tspan fill="#fbbf24">TCG</tspan>
