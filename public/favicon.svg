    <rect x="-92" y="-132" width="184" height="264" rx="16" fill="url(#bg)" stroke="#fbbf24" stroke-width="3" stroke-opacity="0.5" />
    <!-- Crown Emblem inside Card -->
    <path d="M-58 20 L-42 -42 L0 -8 L42 -42 L58 20 Z" fill="url(#gold)" />
    <circle cx="-42" cy="-54" r="9" fill="#fef08a" />
    <circle cx="0" cy="-22" r="10" fill="#f472b6" />
    <circle cx="42" cy="-54" r="9" fill="#38bdf8" />
  </g>
  <!-- milTCG Badge -->
